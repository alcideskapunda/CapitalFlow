services:
  api:
      build: .
      container_name: capitalflow-api
      ports:
        - "3333:3333"
      environment:
        - ASPNETCORE_HTTP_PORTS=3333
        # Connection Strings
        - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=capitalflow;user=root;password=root123
        - ConnectionStrings__HangfireConnection=server=mysql;port=3306;database=capitalflow_hangfire;user=root;password=root123

        # Hangfire Auth
        - Hangfire__Login=hangfire@admin
        - Hangfire__Password=001100
        - Hangfire__RouteName=hangfire

      depends_on:
        - mysql
  mysql:
    image: mysql:8.0
    container_name: capitalflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: capitalflow
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: capitalflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: capitalflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: capitalflow-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  mysql_data: